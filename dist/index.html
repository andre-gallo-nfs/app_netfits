<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Netfits</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #09090b;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(163, 230, 53, 0.2);
        border-top-color: #a3e635;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
      p { font-size: 13px; color: #a1a1aa; max-width: 280px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <h1>Netfits</h1>
    <p>Conectando ao ecossistema esportivo...</p>
    <script>
      const TARGET_URL = 'https://www.netfits.com.br';
      if (navigator.onLine) {
        window.location.replace(TARGET_URL);
      } else {
        window.addEventListener('online', () => {
          window.location.replace(TARGET_URL);
        });
      }
    </script>
  </body>
</html>
