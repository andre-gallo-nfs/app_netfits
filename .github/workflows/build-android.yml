name: Build Android Release (.aab)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build & Sign Android Bundle (.aab)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --include=dev

      - name: Sync Capacitor Android
        run: |
          npx cap sync android --verbose || echo "Proceeding with committed native assets"

      - name: Validate or Restore Upload Keystore
        working-directory: android/app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_SHA1="D7:AB:16:0F:03:08:80:7B:3C:9E:60:51:2E:D5:BC:44:45:A7:AA:F6"
          echo "Scanning previous workflow run artifacts for SHA1: $TARGET_SHA1..."
          FOUND="false"

          for run_id in $(gh run list --workflow=build-android.yml --limit 30 --json databaseId -q '.[].databaseId'); do
            mkdir -p /tmp/check_$run_id
            if gh run download $run_id -n netfits-upload-keystore -D /tmp/check_$run_id 2>/dev/null; then
              if [ -f /tmp/check_$run_id/netfits-upload-key.jks ]; then
                fp=$(keytool -list -v -keystore /tmp/check_$run_id/netfits-upload-key.jks -storepass "Netfits@2026!App" | grep "SHA1:" || true)
                echo "Run $run_id: $fp"
                if echo "$fp" | grep -qi "D7:AB:16:0F"; then
                  echo "🎯 MATCH FOUND IN RUN $run_id! Restoring this exact keystore..."
                  cp /tmp/check_$run_id/netfits-upload-key.jks netfits-upload-key.jks
                  FOUND="true"
                  break
                fi
              fi
            fi
          done

          if [ "$FOUND" = "true" ]; then
            echo "✅ Target Keystore with SHA1 $TARGET_SHA1 restored!"
          elif [ -f "netfits-upload-key.jks" ]; then
            echo "Using committed netfits-upload-key.jks."
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > netfits-upload-key.jks
            echo "Keystore restored from GitHub Secret."
          else
            echo "Generating fallback upload keystore..."
            keytool -genkeypair -v \
              -keystore netfits-upload-key.jks \
              -alias netfits-upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "Netfits@2026!App" \
              -keypass "Netfits@2026!App" \
              -dname "CN=Netfits Mobile, OU=Engenharia, O=Netfits Ltda, L=Santana de Parnaiba, ST=SP, C=BR"
          fi

          echo "### 🔑 Active Keystore Fingerprints:"
          keytool -list -v -keystore netfits-upload-key.jks -storepass "Netfits@2026!App" | grep -A 3 "Certificate fingerprints:" || true

          echo "Exporting public PEM certificate..."
          keytool -export -rfc -keystore netfits-upload-key.jks -alias netfits-upload -storepass "Netfits@2026!App" -file upload_certificate.pem

      - name: Grant Execute Permission to Gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Build Android App Bundle (.aab)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: "Netfits@2026!App"
          KEY_ALIAS: "netfits-upload"
          KEY_PASSWORD: "Netfits@2026!App"
        run: |
          if ! ./gradlew bundleRelease --stacktrace > /tmp/gradle.log 2>&1; then
            echo "## ❌ Gradle Build Error" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 /tmp/gradle.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/gradle.log
            exit 1
          fi
          echo "## ✅ Gradle Build Succeeded!" >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle.log

      - name: Upload Android App Bundle (.aab) Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netfits-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Keystore Artifact (Backup)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: netfits-upload-keystore
          path: android/app/netfits-upload-key.jks
          retention-days: 30

      - name: Publish GitHub Release with Android App Bundle
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4-google-play
          name: "Netfits Android App Bundle v1.0.4 (Onboarding Limpo & Biometria Nativa)"
          body: |
            ### 🚀 Netfits Android Release (.aab) v1.0.4 para Google Play Store
            - **Versão:** 1.0.4 (versionCode 5)
            - **Package ID:** `br.com.netfits.app`
            - **Fluxo Onboarding:** Primeiro acesso abre em Boas-Vindas/Cadastro/Login (/auth) sem pré-carregar contas
            - **Biometria:** Validação nativa real com BiometricPrompt (impressão digital / facial)
            - **Target SDK:** 36 (Conforme exigido pelo Google Play Console)
            - **Min SDK:** 24 (Android 7.0+)
            - **Chave de Assinatura Oficial:** SHA1 D7:AB:16:0F:03:08:80:7B:3C:9E:60:51:2E:D5:BC:44:45:A7:AA:F6 (`netfits-upload-key.jks`)

            Pronto para upload no Google Play Console (Trilha de Teste Interno / Produção).
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/netfits-upload-key.jks
            android/app/upload_certificate.pem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Diagnostics to Branch (On Failure)
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-diagnostics
          cp /tmp/gradle.log ./gradle-build.log
          git add ./gradle-build.log
          git commit -m "diagnostics: gradle build failure log" || true
          git push origin build-diagnostics --force || true
