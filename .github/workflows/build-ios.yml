name: Build iOS Release & TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    name: Build, Sign & Upload to TestFlight
    runs-on: macos-14
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: ios/App

      - name: Install Ruby Gems (Fastlane)
        working-directory: ios/App
        run: |
          bundle install

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install Node Dependencies
        run: npm install --include=dev

      - name: Build Web Production Bundle
        run: npm run build:prod

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios --verbose || echo "Proceeding with committed native assets"

      - name: Setup App Store Connect AuthKey via Python
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          python3 -c "
          import os, base64
          key_id = os.environ['KEY_ID'].strip()
          key_b64 = os.environ['KEY_B64'].strip()
          target_dir = os.path.expanduser('~/.appstoreconnect/private_keys')
          os.makedirs(target_dir, exist_ok=True)
          key_path = os.path.join(target_dir, f'AuthKey_{key_id}.p8')
          raw_data = base64.b64decode(key_b64)
          with open(key_path, 'wb') as f:
              f.write(raw_data)
          os.chmod(key_path, 0o600)
          print(f'AuthKey written to {key_path}, size={os.path.getsize(key_path)} bytes')
          "

      - name: Run Fastlane Beta (Sign & Upload to TestFlight)
        working-directory: ios/App
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: "SA9P4PKNL8"
        run: |
          set -o pipefail
          bundle exec fastlane beta 2>&1 | tee /tmp/fastlane.log

      - name: Backup P12 Certificate
        if: always()
        run: |
          security export -k ~/Library/Keychains/build_keychain-db -t all -f pkcs12 -P "Netfits@2026!Apple" -o /tmp/netfits-apple-distribution.p12 || true

      - name: Upload Certificate Backup Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netfits-apple-distribution-p12
          path: /tmp/netfits-apple-distribution.p12
          retention-days: 90

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netfits-ios-ipa
          path: ios/App/build/*.ipa
          retention-days: 30

      - name: Upload Build Log to Branch (Always)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ios-build-diagnostics
          cp /tmp/fastlane.log ./fastlane-build.log || true
          git add ./fastlane-build.log
          git commit -m "diagnostics: fastlane build log" || true
          git push origin ios-build-diagnostics --force || true
