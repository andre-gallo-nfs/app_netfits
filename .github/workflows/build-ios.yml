name: Build iOS Release & TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    name: Build, Sign & Upload to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: ios/App

      - name: Install Ruby Gems (Fastlane)
        working-directory: ios/App
        run: |
          bundle install

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcode-select -p

      - name: Install Node Dependencies
        run: npm install --include=dev

      - name: Build Web Production Bundle
        run: npm run build:prod

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios --verbose || echo "Proceeding with committed native assets"

      - name: Setup App Store Connect AuthKey
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "AuthKey saved to ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          head -n 1 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Run Fastlane Beta (Sign & Upload to TestFlight)
        working-directory: ios/App
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          bundle exec fastlane beta 2>&1 | tee /tmp/fastlane.log

      - name: Print Fastlane Log (Always)
        if: always()
        run: |
          if [ -f /tmp/fastlane.log ]; then
            echo "## Fastlane Execution Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/fastlane.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netfits-ios-ipa
          path: ios/App/build/*.ipa
          retention-days: 14
